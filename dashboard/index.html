<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vault 대시보드</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="no-data">
  <h1>아직 비어 있습니다</h1>
  <p><span class="path">tools \ 대시보드_갱신.bat</span> 을 실행하면 서가가 채워집니다.</p>
</div>
<div id="app" hidden>
  <header>
    <h1>Vault 대시보드</h1>
    <span id="generated"></span>
    <nav role="tablist" aria-label="대시보드 영역">
      <button class="tab-btn active" data-tab="creation" role="tab" aria-selected="true" aria-controls="tab-creation">창작</button>
      <button class="tab-btn" data-tab="bookclub" role="tab" aria-selected="false" aria-controls="tab-bookclub">독서모임</button>
    </nav>
  </header>
  <div id="warn-banner" hidden></div>
  <main>
    <section id="tab-creation" role="tabpanel">
      <div id="cockpit"></div>
      <div id="next-hero"></div>
      <div id="bridge"></div>
      <div id="shelf"></div>
      <div id="stepper"></div>
      <h2>무대까지의 거리</h2>
      <div id="stage-shelves"></div>
      <div id="mergers"></div>
      <h2>계열 서랍</h2>
      <div id="lineages"></div>
      <div id="footnote"></div>
    </section>
    <section id="tab-bookclub" role="tabpanel" hidden>
      <div id="reading-cockpit"></div>
      <div id="reading-hero"></div>
      <div id="reading-bridge"></div>
      <div id="bc-summary"></div>
      <h2>질문망 — 책들을 잇는 중심 노드</h2>
      <div id="question-net"></div>
      <h2>책 서가</h2>
      <div id="bc-shelf"></div>
      <div id="bc-shelf-rest"></div>
      <h2>비교 강의 선반</h2>
      <div id="lecture-shelf"></div>
      <h2>오래 남은 책들</h2>
      <div id="bc-flow"></div>
    </section>
  </main>
</div>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
