<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vault 대시보드</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="no-data">
  <h1>데이터 없음</h1>
  <p><code>tools\대시보드_갱신.bat</code>을 실행하세요.</p>
</div>
<div id="app" hidden>
  <header>
    <h1>Vault 대시보드</h1>
    <span id="generated"></span>
    <nav role="tablist" aria-label="대시보드 영역">
      <button class="tab-btn active" data-tab="creation" role="tab" aria-selected="true" aria-controls="tab-creation">창작</button>
      <button class="tab-btn" data-tab="bookclub" role="tab" aria-selected="false" aria-controls="tab-bookclub">독서모임</button>
    </nav>
  </header>
  <div id="warn-banner" hidden></div>
  <main>
    <section id="tab-creation" role="tabpanel">
      <div id="next-hero"></div>
      <div id="shelf"></div>
      <div id="stepper"></div>
      <h2>무대로 가는 원고</h2>
      <div id="kanban"></div>
      <div id="mergers"></div>
      <h2>계열 서랍</h2>
      <div id="lineages"></div>
      <div id="footnote"></div>
    </section>
    <section id="tab-bookclub" role="tabpanel" hidden>
      <div id="bc-summary"></div>
      <h2>책 서가</h2>
      <div id="bc-shelf"></div>
      <h2>가장 많은 글감을 낳은 책들</h2>
      <div id="bc-flow"></div>
    </section>
  </main>
</div>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
